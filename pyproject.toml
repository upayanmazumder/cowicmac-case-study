[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cowicmac"
version = "0.1.0"
description = "Software-only simulation of the CoWiC-MAC protocol for WiFi-ZigBee coexistence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Upayan Mazumder", email = "upayanmazumder@users.noreply.github.com" },
    { name = "Nitesh Pandey" },
    { name = "Divyansh Saxena" },
]
dependencies = [
    "simpy>=4.1.1",
    "pulp>=2.8.0,<3.0.0",  # pulp 3+/4+ rewrote LpVariable as a Rust-backed wrapper that breaks the classic keyword constructor API used by milp_scheduler.py
    "highspy>=1.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/cowic"]
